# ==========================================================
# RJ SPORTS — produção num servidor (VPS) com Docker
#   1) cp .env.producao.example .env.producao  (e preencher)
#   2) docker compose up -d --build
# A loja fica em https://SEU-DOMINIO (HTTPS automático).
# ==========================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rjsports
      POSTGRES_USER: rjsports
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env.producao}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rjsports -d rjsports"]
      interval: 10s
      timeout: 5s
      retries: 5

  loja:
    build: .
    restart: unless-stopped
    env_file: .env.producao
    environment:
      DATABASE_URL: postgresql://rjsports:${POSTGRES_PASSWORD}@db:5432/rjsports
      DATABASE_URL_UNPOOLED: postgresql://rjsports:${POSTGRES_PASSWORD}@db:5432/rjsports
    volumes:
      - dados:/dados # fotos e cópias de segurança
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file: .env.producao
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - loja

volumes:
  postgres:
  dados:
  caddy_dados:
  caddy_config:
